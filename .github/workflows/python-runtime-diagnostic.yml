name: CPython Android diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose-python:
    name: CPython arm64 diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 105

    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3

      - name: Install build requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential curl pkg-config autoconf automake libtool \
            libbz2-dev libffi-dev libgdbm-dev liblzma-dev libncurses-dev \
            libreadline-dev libsqlite3-dev libssl-dev tk-dev uuid-dev zlib1g-dev
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "ndk;27.3.13750724"

      - name: Download CPython 3.14.6
        run: |
          mkdir -p .deps/src
          curl --fail --location --retry 4 \
            "https://github.com/python/cpython/archive/refs/tags/v3.14.6.tar.gz" \
            --output .deps/src/cpython.tar.gz
          tar -xzf .deps/src/cpython.tar.gz -C .deps/src
          mv .deps/src/cpython-3.14.6 .deps/src/cpython

      - name: Build CPython and print concise diagnostics
        id: build
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_API_LEVEL: 24
        run: |
          set +e
          cd .deps/src/cpython/Android
          python3 android.py build aarch64-linux-android -- --without-ensurepip \
            > "${GITHUB_WORKSPACE}/cpython-diagnostic.log" 2>&1
          STATUS=$?
          cd "${GITHUB_WORKSPACE}"
          echo "CPython build exit status: ${STATUS}"
          echo "----- LAST 220 LOG LINES -----"
          tail -n 220 cpython-diagnostic.log
          exit "${STATUS}"

      - name: Upload full CPython diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-android-diagnostic
          path: cpython-diagnostic.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('cpython-diagnostic.log', 'utf8');
            const tail = log.split(/\r?\n/).slice(-220).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CPython Android build diagnostic\n\n\`\`\`text\n${tail}\n\`\`\``
            });
