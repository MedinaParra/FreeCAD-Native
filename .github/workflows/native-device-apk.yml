name: Native device APK

on:
  workflow_dispatch:
  push:
    branches: [native-device-test]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Compile native APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee native-build.log
      - name: Report native build failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('native-build.log')
              ? fs.readFileSync('native-build.log', 'utf8')
              : 'native-build.log was not created';
            const tail = log.slice(-18000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Native build failure\n\n\`\`\`text\n${tail}\n\`\`\``
            });
      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: native-build.log
          if-no-files-found: warn
      - name: Verify native libraries
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libfreecad_android_core.so" apk-contents.txt
          grep -q "lib/x86_64/libfreecad_android_core.so" apk-contents.txt
          cp app/build/outputs/apk/debug/app-debug.apk FreeCAD-Native-Device-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: freecad-native-device-apk
          path: FreeCAD-Native-Device-v0.3.0.apk
          if-no-files-found: error
