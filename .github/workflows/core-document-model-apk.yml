name: FreeCAD App core model APK

on:
  workflow_dispatch:
  push:
    branches: [native-core-document-model]

permissions:
  actions: read
  contents: read

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.22.1
  OCCT_SOURCE_RUN: 29661014810
  CPYTHON_SOURCE_RUN: 29654366295

jobs:
  build-apk:
    name: Android App document core APK
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Download validated native dependencies
        run: echo "Reusing the OCCT STEP and CPython runtimes already validated on device"

      - uses: actions/download-artifact@v4
        with:
          name: occt-step-armeabi-v7a
          path: .deps/occt/armeabi-v7a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.OCCT_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: occt-step-arm64-v8a
          path: .deps/occt/arm64-v8a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.OCCT_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: cpython-armeabi-v7a
          path: .deps/python/armeabi-v7a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.CPYTHON_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: cpython-arm64-v8a
          path: .deps/python/arm64-v8a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.CPYTHON_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable App core model and FreeCAD file sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path('app/src/main/cpp/CMakeLists.txt')
          text = cmake.read_text()
          text = text.replace(
              'CadCore.cpp CadCoreScripting.cpp OcctMesher.cpp StepIo.cpp',
              'BrepIo.cpp CadCore.cpp CadCoreScripting.cpp OcctMesher.cpp StepIo.cpp')
          text = text.replace(
              'jni_bridge.cpp jni_python_bridge.cpp jni_step_bridge.cpp',
              'jni_bridge.cpp jni_freecad_file_bridge.cpp jni_python_bridge.cpp jni_step_bridge.cpp')
          cmake.write_text(text)

          activity = Path('app/src/main/java/com/medinaparra/freecadandroid/MainActivity.kt')
          activity.write_text(activity.read_text().replace('MainScreenCore', 'MainScreenFiles'))

          screen = Path('app/src/main/java/com/medinaparra/freecadandroid/ui/MainScreenFiles.kt')
          screen.write_text(screen.read_text().replace(
              'TextStyle(FontFamily.Monospace, fontSize = 12.sp)',
              'TextStyle(fontFamily = FontFamily.Monospace, fontSize = 12.sp)'))

          freecad = Path('app/src/main/python/FreeCAD.py')
          source = freecad.read_text()
          source = source.replace(
              'return ("0", "5", "0", "Android", _native.kernel_info())',
              'return ("0", "8", "0", "Android", _native.kernel_info())')
          source += '''\n\n# Extended App document model installed by the mobile core build.\nimport FreeCADCore as _FreeCADCore\n_FreeCADCore.install(sys.modules[__name__])\n'''
          freecad.write_text(source)

          gradle = Path('app/build.gradle.kts')
          source = gradle.read_text().replace('versionCode = 7', 'versionCode = 9')
          source = source.replace('versionName = "0.6.0-step-io"',
                                  'versionName = "0.8.0-app-core"')
          gradle.write_text(source)
          PY
          grep -q 'FreeCADCore.install' app/src/main/python/FreeCAD.py
          grep -q 'BrepIo.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'MainScreenFiles' app/src/main/java/com/medinaparra/freecadandroid/MainActivity.kt
          python3 -m py_compile app/src/main/python/*.py

      - name: Test App document model on host Python
        run: |
          python3 - <<'PY'
          import sys, types
          native = types.ModuleType('_freecad_native')
          counter = {'value': 0}
          def new_id(*args):
              counter['value'] += 1
              return counter['value']
          native.create_document = new_id
          native.close_document = lambda *args: None
          native.reset = lambda: None
          native.set_active_document = lambda *args: None
          native.add_box = new_id
          native.add_cylinder = new_id
          native.add_sphere = new_id
          native.add_cone = new_id
          native.add_torus = new_id
          native.add_fuse = new_id
          native.add_cut = new_id
          native.add_common = new_id
          native.set_parameter = lambda *args: None
          native.set_boolean_operands = lambda *args: None
          native.set_placement = lambda *args: None
          native.set_visibility = lambda *args: None
          native.recompute = lambda *args: True
          native.kernel_info = lambda: 'host-stub'
          sys.modules['_freecad_native'] = native
          sys.path.insert(0, 'app/src/main/python')

          import FreeCAD as App
          import Part

          doc = App.newDocument('CoreModelTest')
          box = doc.addObject('Part::Box', 'Box')
          box.addProperty('App::PropertyString', 'Code', 'Identity', 'Part code')
          box.Code = 'MOBILE-001'
          box.addProperty('App::PropertyLength', 'DrivenHeight', 'Dimensions')
          box.setExpression('DrivenHeight', 'Box.Width * 2')

          transaction = doc.openTransaction('Resize box')
          assert transaction > 0
          box.Width = 25
          doc.abortTransaction()
          assert box.Width == 10

          group = doc.addObject('App::DocumentObjectGroup', 'Parts')
          group.addObject(box)
          controller = doc.addObject('App::FeaturePython', 'Controller')
          controller.addProperty('App::PropertyLink', 'Source', 'Links')
          controller.Source = box

          assert box in group.Group
          assert box in controller.OutList
          assert controller in box.InList
          assert 'Code' in box.PropertiesList
          assert doc.recompute()
          assert box.DrivenHeight == 20
          assert box.State == []
          assert App.Vector(1, 0, 0).cross(App.Vector(0, 1, 0)).z == 1
          assert App.Version()[:3] == ('0', '8', '0')
          print('App core model smoke test passed')
          PY

      - name: Package native libraries and Python runtime
        run: |
          rm -rf app/src/main/jniLibs app/src/main/assets/python-runtime .build/python-assets
          mkdir -p app/src/main/assets/python-runtime .build/python-assets
          for ABI in armeabi-v7a arm64-v8a; do
            test -f ".deps/occt/${ABI}/lib/libTKDESTEP.so"
            test -f ".deps/python/${ABI}/lib/libpython3.14.so"
            mkdir -p "app/src/main/jniLibs/${ABI}"
            cp ".deps/occt/${ABI}/lib/"*.so "app/src/main/jniLibs/${ABI}/"
            find ".deps/python/${ABI}/lib" -maxdepth 1 -type f -name '*.so' \
              -exec cp {} "app/src/main/jniLibs/${ABI}/" \;
            STAGE=".build/python-assets/${ABI}"
            mkdir -p "${STAGE}/lib/python3.14/site-packages"
            rsync -a ".deps/python/${ABI}/lib/python3.14/" "${STAGE}/lib/python3.14/"
            cp app/src/main/python/*.py "${STAGE}/lib/python3.14/site-packages/"
            find "${STAGE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            (cd "${STAGE}" && zip -q -9 -r \
              "${GITHUB_WORKSPACE}/app/src/main/assets/python-runtime/${ABI}.zip" .)
          done

      - name: Compile APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee app-core-build.log

      - name: Verify App core runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "${APK}" | tee apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/${ABI}/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/${ABI}/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/${ABI}/libpython3.14.so" apk-contents.txt
            grep -q "assets/python-runtime/${ABI}.zip" apk-contents.txt
            unzip -p "${APK}" "assets/python-runtime/${ABI}.zip" > "/tmp/${ABI}.zip"
            unzip -l "/tmp/${ABI}.zip" | grep -q 'FreeCADCore.py'
          done
          cp "${APK}" FreeCAD-Android-App-Core-v0.8.0.apk
          sha256sum FreeCAD-Android-App-Core-v0.8.0.apk \
            > FreeCAD-Android-App-Core-v0.8.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: freecad-android-app-core-apk
          path: |
            FreeCAD-Android-App-Core-v0.8.0.apk
            FreeCAD-Android-App-Core-v0.8.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-core-build-diagnostics
          path: |
            app-core-build.log
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 7
