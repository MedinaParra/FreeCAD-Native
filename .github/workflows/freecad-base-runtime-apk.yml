name: FreeCAD Base runtime APK

on:
  workflow_dispatch:
  push:
    branches: [native-base-runtime]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: freecad-base-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.22.1
  OCCT_SOURCE_RUN: 29661014810
  CPYTHON_SOURCE_RUN: 29654366295
  FREECAD_TAG: 1.1.1

jobs:
  build-apk:
    name: Android upstream FreeCADBase APK
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - uses: android-actions/setup-android@v3

      - name: Install Android and host toolchains
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Fetch official FreeCAD source
        run: |
          rm -rf .deps/freecad .deps/freecad-generated .deps/boost
          git clone --depth 1 --branch "${FREECAD_TAG}" \
            https://github.com/FreeCAD/FreeCAD.git .deps/freecad
          mkdir -p .deps/freecad-generated .deps/boost
          cp -a /usr/include/boost .deps/boost/
          cat > .deps/freecad-generated/FCGlobal.h <<'EOF'
          #pragma once
          #ifndef FC_GLOBAL_H
          #define FC_GLOBAL_H
          #include <algorithm>
          #include <concepts>
          #include <type_traits>
          #define BaseExport
          #define AppExport
          #define GuiExport
          #define DataExport
          #endif
          EOF
          test -f .deps/freecad/src/Base/Vector3D.cpp
          test -f .deps/freecad/src/Base/Matrix.cpp
          grep -q 'SPDX-License-Identifier: LGPL-2.1-or-later' \
            .deps/freecad/src/Base/Vector3D.cpp

      - name: Test upstream FreeCADBase sources on host
        run: |
          cat > /tmp/freecad-base-smoke.cpp <<'CPP'
          #include <Matrix.h>
          #include <Vector3D.h>
          #include <cmath>
          #include <iostream>
          int main() {
              Base::Vector3d v(3.0, 4.0, 12.0);
              Base::Matrix4D m;
              m.move(10.0, 20.0, 30.0);
              Base::Vector3d out = m * Base::Vector3d(1.0, 2.0, 3.0);
              bool ok = std::abs(v.Length() - 13.0) < 1.0e-12 &&
                        std::abs(out.x - 11.0) < 1.0e-12 &&
                        std::abs(out.y - 22.0) < 1.0e-12 &&
                        std::abs(out.z - 33.0) < 1.0e-12 &&
                        std::abs(m.determinant() - 1.0) < 1.0e-12;
              std::cout << "FreeCADBase host test: " << (ok ? "PASS" : "FAIL") << '\n';
              return ok ? 0 : 1;
          }
          CPP
          g++ -std=c++20 -O2 \
            -I.deps/freecad-generated \
            -I.deps/freecad/src/Base \
            -I.deps/boost \
            .deps/freecad/src/Base/Vector3D.cpp \
            .deps/freecad/src/Base/Matrix.cpp \
            /tmp/freecad-base-smoke.cpp \
            -o /tmp/freecad-base-smoke
          /tmp/freecad-base-smoke

      - name: Validate official FreeCAD 1.1.1 FCStd samples
        run: python3 tests/fcstd_official_samples_contract.py .deps/freecad

      - uses: actions/download-artifact@v4
        with:
          name: occt-step-armeabi-v7a
          path: .deps/occt/armeabi-v7a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.OCCT_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: occt-step-arm64-v8a
          path: .deps/occt/arm64-v8a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.OCCT_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: cpython-armeabi-v7a
          path: .deps/python/armeabi-v7a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.CPYTHON_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: cpython-arm64-v8a
          path: .deps/python/arm64-v8a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.CPYTHON_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable upstream FreeCADBase and house macro support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f"Patch marker not found: {label}")
              return text.replace(old, new, 1)

          cmake = Path('app/src/main/cpp/CMakeLists.txt')
          text = cmake.read_text()
          text = replace_once(
              text,
              'CadCore.cpp CadCoreScripting.cpp OcctMesher.cpp StepIo.cpp',
              'BaseRuntimeProbe.cpp CadCore.cpp CadCorePrism.cpp CadCoreScripting.cpp OcctMesher.cpp StepIo.cpp\n'
              '    "${FREECAD_BASE_SOURCE}/Vector3D.cpp"\n'
              '    "${FREECAD_BASE_SOURCE}/Matrix.cpp"',
              'CMake source list')
          text = text.replace('cxx_std_17', 'cxx_std_20')
          text = replace_once(
              text,
              '"${CMAKE_CURRENT_SOURCE_DIR}" "${OCCT_INCLUDE_DIR}" "${PYTHON_INCLUDE_DIR}")',
              '"${CMAKE_CURRENT_SOURCE_DIR}" "${OCCT_INCLUDE_DIR}" "${PYTHON_INCLUDE_DIR}"\n'
              '    "${FREECAD_BASE_SOURCE}" "${FREECAD_BASE_GENERATED}" "${BOOST_HEADER_ROOT}")',
              'CMake includes')
          cmake.write_text(text)

          header = Path('app/src/main/cpp/CadCore.hpp')
          text = header.read_text()
          text = replace_once(text, '    Torus,\n    Fuse,', '    Torus,\n    Prism,\n    Fuse,', 'Prism enum')
          text = replace_once(
              text,
              '    std::array<double, 4> parameters {0.0, 0.0, 0.0, 0.0};\n',
              '    std::array<double, 4> parameters {0.0, 0.0, 0.0, 0.0};\n'
              '    std::vector<double> profileData;\n',
              'Prism data')
          text = replace_once(
              text,
              '    std::uint64_t addFuse(\n',
              '    std::uint64_t addPrism(\n'
              '        std::uint64_t documentId,\n'
              '        const std::string& name,\n'
              '        const std::vector<double>& profileCoordinates,\n'
              '        double dx,\n'
              '        double dy,\n'
              '        double dz);\n\n'
              '    std::uint64_t addFuse(\n',
              'addPrism declaration')
          header.write_text(text)

          core = Path('app/src/main/cpp/CadCore.cpp')
          text = core.read_text()
          text = replace_once(
              text,
              '#include <BRepBuilderAPI_Transform.hxx>\n',
              '#include <BRepBuilderAPI_Transform.hxx>\n'
              '#include <BRepBuilderAPI_MakeFace.hxx>\n'
              '#include <BRepBuilderAPI_MakePolygon.hxx>\n'
              '#include <BRepPrimAPI_MakePrism.hxx>\n',
              'Prism includes')
          text = replace_once(
              text,
              '        case ObjectKind::Torus: return "Part::Torus";\n',
              '        case ObjectKind::Torus: return "Part::Torus";\n'
              '        case ObjectKind::Prism: return "Part::Prism";\n',
              'Prism name')
          torus_block = '''        case ObjectKind::Torus:
                      result = BRepPrimAPI_MakeTorus(
                          object.parameters[0], object.parameters[1]).Shape();
                      break;
                  case ObjectKind::Fuse:'''
          prism_block = '''        case ObjectKind::Torus:
                      result = BRepPrimAPI_MakeTorus(
                          object.parameters[0], object.parameters[1]).Shape();
                      break;
                  case ObjectKind::Prism: {
                        std::size_t pointCount = object.profileData.size() / 3U;
                        if (pointCount < 3U) {
                            throw std::runtime_error("Prism profile has fewer than three points");
                        }
                        if (pointCount > 3U) {
                            const std::size_t last = (pointCount - 1U) * 3U;
                            if (std::abs(object.profileData[0] - object.profileData[last]) <= 1.0e-12 &&
                                std::abs(object.profileData[1] - object.profileData[last + 1U]) <= 1.0e-12 &&
                                std::abs(object.profileData[2] - object.profileData[last + 2U]) <= 1.0e-12) {
                                --pointCount;
                            }
                        }
                        BRepBuilderAPI_MakePolygon polygon;
                        for (std::size_t index = 0; index < pointCount; ++index) {
                            const std::size_t base = index * 3U;
                            polygon.Add(gp_Pnt(object.profileData[base],
                                               object.profileData[base + 1U],
                                               object.profileData[base + 2U]));
                        }
                        polygon.Close();
                        if (!polygon.IsDone()) {
                            throw std::runtime_error("Unable to build prism polygon");
                        }
                        BRepBuilderAPI_MakeFace face(polygon.Wire());
                        if (!face.IsDone()) {
                            throw std::runtime_error("Unable to build prism face");
                        }
                        BRepPrimAPI_MakePrism prism(
                            face.Face(),
                            gp_Vec(object.parameters[0], object.parameters[1], object.parameters[2]),
                            Standard_True);
                        prism.Build();
                        if (!prism.IsDone()) {
                            throw std::runtime_error("Unable to extrude prism face");
                        }
                        result = prism.Shape();
                        break;
                    }
                  case ObjectKind::Fuse:'''
          text = replace_once(text, torus_block, prism_block, 'Prism evaluator')
          core.write_text(text)

          scripting = Path('app/src/main/cpp/CadCoreScripting.cpp')
          text = scripting.read_text()
          text = replace_once(
              text,
              '        case ObjectKind::Fuse:\n        case ObjectKind::Cut:\n        case ObjectKind::Common:\n            break;\n',
              '        case ObjectKind::Prism:\n            break;\n'
              '        case ObjectKind::Fuse:\n        case ObjectKind::Cut:\n        case ObjectKind::Common:\n            break;\n',
              'Prism validation')
          scripting.write_text(text)

          module = Path('app/src/main/cpp/PyFreeCadModule.cpp')
          text = module.read_text()
          if '#include <vector>' not in text:
              text = text.replace('#include <string>\n', '#include <string>\n#include <vector>\n')
          prism_function = r'''
          PyObject* pyAddPrism(PyObject*, PyObject* args) {
              unsigned long long documentId = 0;
              const char* name = nullptr;
              PyObject* coordinateObject = nullptr;
              double dx = 0.0;
              double dy = 0.0;
              double dz = 0.0;
              if (!PyArg_ParseTuple(args, "KsOddd:add_prism", &documentId, &name,
                                    &coordinateObject, &dx, &dy, &dz)) {
                  return nullptr;
              }
              PyObject* sequence = PySequence_Fast(
                  coordinateObject, "Prism coordinates must be a sequence");
              if (sequence == nullptr) {
                  return nullptr;
              }
              std::vector<double> coordinates;
              const Py_ssize_t size = PySequence_Fast_GET_SIZE(sequence);
              coordinates.reserve(static_cast<std::size_t>(size));
              for (Py_ssize_t index = 0; index < size; ++index) {
                  const double value = PyFloat_AsDouble(PySequence_Fast_GET_ITEM(sequence, index));
                  if (PyErr_Occurred()) {
                      Py_DECREF(sequence);
                      return nullptr;
                  }
                  coordinates.push_back(value);
              }
              try {
                  const std::uint64_t result = fcandroid::CadCore::instance().addPrism(
                      asId(documentId), name, coordinates, dx, dy, dz);
                  Py_DECREF(sequence);
                  return PyLong_FromUnsignedLongLong(result);
              } catch (...) {
                  Py_DECREF(sequence);
                  setPythonErrorFromCurrentException();
                  return nullptr;
              }
          }

          '''.replace('          ', '')
          text = replace_once(text, 'PyObject* addBoolean(PyObject* args,', prism_function + 'PyObject* addBoolean(PyObject* args,', 'Python prism function')
          text = replace_once(
              text,
              '    {"add_torus", pyAddTorus, METH_VARARGS, "Add a parametric torus."},\n',
              '    {"add_torus", pyAddTorus, METH_VARARGS, "Add a parametric torus."},\n'
              '    {"add_prism", pyAddPrism, METH_VARARGS, "Add an extruded polygon prism."},\n',
              'Python prism method')
          module.write_text(text)

          freecad = Path('app/src/main/python/FreeCAD.py')
          source = freecad.read_text()
          source = source.replace(
              '__slots__ = ("_owner", "ShapeColor", "LineColor", "DisplayMode")',
              '__slots__ = ("_owner", "ShapeColor", "LineColor", "Transparency", "DisplayMode")')
          source = source.replace(
              '        self.LineColor = (0.1, 0.1, 0.1)\n        self.DisplayMode = "Flat Lines"',
              '        self.LineColor = (0.1, 0.1, 0.1)\n        self.Transparency = 0\n        self.DisplayMode = "Flat Lines"')
          source = source.replace(
              'return ("0", "5", "0", "Android", _native.kernel_info())',
              'return ("0", "10", "0", "Android", _native.kernel_info())')
          if 'FreeCADCore.install' not in source:
              source += '\n\nimport FreeCADCore as _FreeCADCore\n_FreeCADCore.install(sys.modules[__name__])\n'
          freecad.write_text(source)

          part = Path('app/src/main/python/Part.py')
          source = part.read_text()
          if '_android_house_macro_support' not in source:
              source += textwrap.dedent(r'''

          # Extended compatibility for generated architectural macros.
          _android_house_macro_support = True

          class Wire:
              def __init__(self, points):
                  self.Points = [p.copy() if isinstance(p, App.Vector) else App.Vector(*p) for p in points]
                  if len(self.Points) < 3:
                      raise ValueError("Part.makePolygon requires at least three points")

          class Face:
              def __init__(self, wire):
                  if not isinstance(wire, Wire):
                      raise TypeError("Part.Face expects a Part.Wire")
                  self.Wire = wire

              def extrude(self, vector):
                  vector = vector if isinstance(vector, App.Vector) else App.Vector(*vector)
                  if vector.Length <= 1.0e-12:
                      raise ValueError("Extrusion vector must not be null")
                  points = list(self.Wire.Points)
                  if len(points) > 3:
                      first, last = points[0], points[-1]
                      if (abs(first.x-last.x) <= 1.0e-12 and
                              abs(first.y-last.y) <= 1.0e-12 and
                              abs(first.z-last.z) <= 1.0e-12):
                          points.pop()
                  flat = tuple(value for point in points for value in (point.x, point.y, point.z))
                  return Shape("Part::Prism", (flat, vector.x, vector.y, vector.z), App.Placement())

          def makePolygon(points):
              return Wire(points)

          _original_makeCylinder = makeCylinder

          def _rotation_from_z(direction):
              direction = direction if isinstance(direction, App.Vector) else App.Vector(*direction)
              length = direction.Length
              if length <= 1.0e-12:
                  raise ValueError("Direction vector must not be null")
              nx, ny, nz = direction.x/length, direction.y/length, direction.z/length
              nz = max(-1.0, min(1.0, nz))
              if nz >= 1.0 - 1.0e-12:
                  return App.Rotation()
              if nz <= -1.0 + 1.0e-12:
                  return App.Rotation(App.Vector(1, 0, 0), 180)
              return App.Rotation(App.Vector(-ny, nx, 0), math.degrees(math.acos(nz)))

          def makeCylinder(radius, height, pnt=None, dir=None, angle=360.0):
              shape = _original_makeCylinder(radius, height, None, None, angle)
              base = pnt if isinstance(pnt, App.Vector) else App.Vector(*(pnt or (0, 0, 0)))
              shape.Placement = App.Placement(base, App.Rotation() if dir is None else _rotation_from_z(dir))
              return shape

          def _apply_spec_placement(document_id, native_id, spec):
              placement = getattr(spec, "_placement", None)
              if not isinstance(placement, App.Placement):
                  return
              base = placement.Base
              qx, qy, qz, qw = placement.Rotation.Q
              App._native.set_placement(document_id, native_id, base.x, base.y, base.z, qx, qy, qz, qw)

          def _materialize_spec(document, spec, name, sequence):
              if not isinstance(spec, Shape):
                  raise TypeError("Part::Feature.Shape expects a Part.Shape")
              sequence[0] += 1
              unique = f"{name}_{sequence[0]}"
              kind = spec._kind
              params = tuple(spec._params)
              primitives = {
                  "Part::Box": App._native.add_box,
                  "Part::Cylinder": App._native.add_cylinder,
                  "Part::Sphere": App._native.add_sphere,
                  "Part::Cone": App._native.add_cone,
                  "Part::Torus": App._native.add_torus,
              }
              booleans = {
                  "Part::Fuse": App._native.add_fuse,
                  "Part::Cut": App._native.add_cut,
                  "Part::Common": App._native.add_common,
              }
              if kind in primitives:
                  native_id = primitives[kind](document._id, unique, *params)
              elif kind == "Part::Prism":
                  coordinates, dx, dy, dz = params
                  native_id = App._native.add_prism(document._id, unique, coordinates, dx, dy, dz)
              elif kind in booleans:
                  left = _materialize_spec(document, spec._left, unique + "_Base", sequence)
                  right = _materialize_spec(document, spec._right, unique + "_Tool", sequence)
                  native_id = booleans[kind](document._id, unique, left, right)
              else:
                  raise NotImplementedError(f"Unsupported Part shape specification: {kind!r}")
              _apply_spec_placement(document._id, native_id, spec)
              return int(native_id)

          def _compat_materialize_shape_spec(self):
              if self._id or self._shape_spec is None:
                  return
              if not self._shape_spec.isValid():
                  raise ValueError("Part::Feature.Shape contains an invalid or cyclic specification")
              native_id = _materialize_spec(self._document, self._shape_spec, self.Name, [0])
              object.__setattr__(self, "_id", native_id)
              App._native.set_visibility(self._document._id, native_id, self._visibility)

          App.DocumentObject._materialize_shape_spec = _compat_materialize_shape_spec
          for _name in ("Wire", "Face", "makePolygon"):
              if _name not in __all__:
                  __all__.append(_name)
          ''')
          part.write_text(source)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text().replace('-std=c++17', '-std=c++20')
          text = text.replace(
              '"-DPYTHON_INSTALL_ROOT=${rootProject.projectDir.absolutePath}/.deps/python"',
              '"-DPYTHON_INSTALL_ROOT=${rootProject.projectDir.absolutePath}/.deps/python",\n'
              '                    "-DFREECAD_BASE_SOURCE=${rootProject.projectDir.absolutePath}/.deps/freecad/src/Base",\n'
              '                    "-DFREECAD_BASE_GENERATED=${rootProject.projectDir.absolutePath}/.deps/freecad-generated",\n'
              '                    "-DBOOST_HEADER_ROOT=${rootProject.projectDir.absolutePath}/.deps/boost"')
          text = text.replace('versionCode = 7', 'versionCode = 13')
          text = text.replace('versionName = "0.6.0-step-io"', 'versionName = "0.11.0-fcstd-object-editor"')
          gradle.write_text(text)

          bridge = Path('app/src/main/java/com/medinaparra/freecadandroid/nativebridge/FreeCadBaseBridge.kt')
          bridge.write_text(r'''package com.medinaparra.freecadandroid.nativebridge

          object FreeCadBaseBridge {
              init { System.loadLibrary("freecad_android_core") }
              external fun nativeSelfTest(): String
              fun selfTest(): String = try { nativeSelfTest() }
                  catch (error: Throwable) {
                      "FREECAD BASE NO DISPONIBLE\n${error.message ?: error::class.java.simpleName}"
                  }
          }
          ''')

          screen = Path('app/src/main/java/com/medinaparra/freecadandroid/ui/MainScreenFiles.kt')
          text = screen.read_text()
          text = text.replace('TextStyle(FontFamily.Monospace, fontSize = 12.sp)',
                              'TextStyle(fontFamily = FontFamily.Monospace, fontSize = 12.sp)')
          text = text.replace(
              'import com.medinaparra.freecadandroid.nativebridge.NativeCadBridge',
              'import com.medinaparra.freecadandroid.nativebridge.FreeCadBaseBridge\n'
              'import com.medinaparra.freecadandroid.nativebridge.NativeCadBridge')
          text = text.replace(
              'var state by remember { mutableStateOf(FilesState()) }',
              'var state by remember { mutableStateOf(FilesState()) }\n'
              '    val freeCadBaseStatus = remember { FreeCadBaseBridge.selfTest() }')
          text = text.replace('CPYTHON + OCCT + STEP + FCMACRO + FCSTD',
                              'FREECADBASE + HOUSE MACRO + CPYTHON + OCCT + STEP + FCSTD')
          text = text.replace(
              'state.error ?: scene?.summary ?: state.phase,',
              'state.error ?: ((scene?.summary ?: state.phase) + "\\n\\n" + freeCadBaseStatus),')
          text = text.replace('maxLines = 10', 'maxLines = 14')
          screen.write_text(text)

          assets = Path('app/src/main/assets/licenses')
          assets.mkdir(parents=True, exist_ok=True)
          Path(assets / 'FreeCAD-LGPL-2.1.txt').write_text(Path('.deps/freecad/LICENSE').read_text())
          PY
          grep -q 'CadCorePrism.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'ObjectKind::Prism' app/src/main/cpp/CadCore.cpp
          grep -q 'add_prism' app/src/main/cpp/PyFreeCadModule.cpp
          grep -q 'makePolygon' app/src/main/python/Part.py
          grep -q 'FreeCADCore.install' app/src/main/python/FreeCAD.py
          python3 -m py_compile app/src/main/python/*.py
          python3 tests/solidfreecad_contract.py

      - name: Test house macro API compatibility
        run: |
          python3 - <<'PY'
          import sys, types
          native = types.ModuleType('_freecad_native')
          counter = {'value': 0}
          def new_id(*args):
              counter['value'] += 1
              return counter['value']
          native.create_document = new_id
          native.close_document = lambda *a: None
          native.remove_object = lambda *a: None
          native.reset = lambda: None
          native.set_active_document = lambda *a: None
          native.add_box = new_id
          native.add_cylinder = new_id
          native.add_sphere = new_id
          native.add_cone = new_id
          native.add_torus = new_id
          native.add_prism = new_id
          native.add_fuse = new_id
          native.add_cut = new_id
          native.add_common = new_id
          native.set_parameter = lambda *a: None
          native.set_boolean_operands = lambda *a: None
          native.set_placement = lambda *a: None
          native.set_visibility = lambda *a: None
          native.recompute = lambda *a: True
          native.kernel_info = lambda: 'host-stub'
          sys.modules['_freecad_native'] = native
          sys.path.insert(0, 'app/src/main/python')
          import FreeCAD as App
          import Part
          doc = App.newDocument('CasaParametrica')
          group = doc.addObject('App::DocumentObjectGroup', 'Muros')
          wall = Part.makeBox(10000, 200, 2800, App.Vector(0, 0, 200))
          opening = Part.makeBox(1000, 220, 2200, App.Vector(4500, -10, 200))
          feature = doc.addObject('Part::Feature', 'MuroFrontal')
          feature.Shape = wall.cut(opening).removeSplitter()
          feature.ViewObject.Transparency = 15
          group.addObject(feature)
          points = [App.Vector(0, 0, 3000), App.Vector(10000, 0, 3000),
                    App.Vector(5000, 0, 4800), App.Vector(0, 0, 3000)]
          gable = doc.addObject('Part::Feature', 'Fronton')
          gable.Shape = Part.Face(Part.makePolygon(points)).extrude(App.Vector(0, 200, 0))
          ridge = doc.addObject('Part::Feature', 'Cumbrera')
          ridge.Shape = Part.makeCylinder(90, 8800, App.Vector(5000, -400, 4840), App.Vector(0, 1, 0))
          assert doc.recompute()
          assert len(group.Group) == 1
          assert feature.ViewObject.Transparency == 15
          assert gable._id and ridge._id
          print('House macro compatibility test passed')
          PY

      - name: Package validated OCCT and CPython runtimes
        run: |
          rm -rf app/src/main/jniLibs app/src/main/assets/python-runtime .build/python-assets
          mkdir -p app/src/main/assets/python-runtime .build/python-assets
          for ABI in armeabi-v7a arm64-v8a; do
            test -f ".deps/occt/${ABI}/lib/libTKDESTEP.so"
            test -f ".deps/python/${ABI}/lib/libpython3.14.so"
            mkdir -p "app/src/main/jniLibs/${ABI}"
            cp ".deps/occt/${ABI}/lib/"*.so "app/src/main/jniLibs/${ABI}/"
            find ".deps/python/${ABI}/lib" -maxdepth 1 -type f -name '*.so' \
              -exec cp {} "app/src/main/jniLibs/${ABI}/" \;
            STAGE=".build/python-assets/${ABI}"
            mkdir -p "${STAGE}/lib/python3.14/site-packages"
            rsync -a ".deps/python/${ABI}/lib/python3.14/" "${STAGE}/lib/python3.14/"
            cp app/src/main/python/*.py "${STAGE}/lib/python3.14/site-packages/"
            find "${STAGE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            (cd "${STAGE}" && zip -q -9 -r \
              "${GITHUB_WORKSPACE}/app/src/main/assets/python-runtime/${ABI}.zip" .)
          done

      - name: Compile APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee freecad-base-build.log

      - name: Verify upstream FreeCADBase runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "${APK}" | tee apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/${ABI}/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/${ABI}/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/${ABI}/libpython3.14.so" apk-contents.txt
          done
          grep -q 'assets/licenses/FreeCAD-LGPL-2.1.txt' apk-contents.txt
          find app/build -name libfreecad_android_core.so -print -exec sh -c \
            'llvm-nm -C "$1" 2>/dev/null | grep -q "Base::Matrix4D::determinant"' _ {} \;
          find app/build -name libfreecad_android_core.so -print -exec sh -c \
            'llvm-nm -C "$1" 2>/dev/null | grep -q "CadCore::addPrism"' _ {} \;
          find app/build -name libfreecad_android_core.so -print -exec sh -c \
            'llvm-nm -C "$1" 2>/dev/null | grep -q "CadCore::removeObject"' _ {} \;
          cp "${APK}" FreeCAD-Android-Base-Runtime-v0.11.0.apk
          sha256sum FreeCAD-Android-Base-Runtime-v0.11.0.apk \
            > FreeCAD-Android-Base-Runtime-v0.11.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: freecad-android-base-runtime-v0110-apk
          path: |
            FreeCAD-Android-Base-Runtime-v0.11.0.apk
            FreeCAD-Android-Base-Runtime-v0.11.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-base-runtime-v0110-diagnostics
          path: |
            freecad-base-build.log
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 7
