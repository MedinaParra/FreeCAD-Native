name: FreeCAD Base runtime APK

on:
  workflow_dispatch:
  push:
    branches: [native-base-runtime]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.22.1
  OCCT_SOURCE_RUN: 29661014810
  CPYTHON_SOURCE_RUN: 29654366295
  FREECAD_TAG: 1.1.1

jobs:
  build-apk:
    name: Android upstream FreeCADBase APK
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - uses: android-actions/setup-android@v3

      - name: Install Android and host toolchains
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Fetch official FreeCAD source
        run: |
          rm -rf .deps/freecad .deps/freecad-generated .deps/boost
          git clone --depth 1 --branch "${FREECAD_TAG}" \
            https://github.com/FreeCAD/FreeCAD.git .deps/freecad
          mkdir -p .deps/freecad-generated .deps/boost
          cp -a /usr/include/boost .deps/boost/
          cat > .deps/freecad-generated/FCGlobal.h <<'EOF'
          #pragma once
          #ifndef FC_GLOBAL_H
          #define FC_GLOBAL_H
          #include <algorithm>
          #include <concepts>
          #include <type_traits>
          #define BaseExport
          #define AppExport
          #define GuiExport
          #define DataExport
          #endif
          EOF
          test -f .deps/freecad/src/Base/Vector3D.cpp
          test -f .deps/freecad/src/Base/Matrix.cpp
          grep -q 'SPDX-License-Identifier: LGPL-2.1-or-later' \
            .deps/freecad/src/Base/Vector3D.cpp

      - name: Test upstream FreeCADBase sources on host
        run: |
          cat > /tmp/freecad-base-smoke.cpp <<'CPP'
          #include <Matrix.h>
          #include <Vector3D.h>
          #include <cmath>
          #include <iostream>
          int main() {
              Base::Vector3d v(3.0, 4.0, 12.0);
              Base::Matrix4D m;
              m.move(10.0, 20.0, 30.0);
              Base::Vector3d out = m * Base::Vector3d(1.0, 2.0, 3.0);
              bool ok = std::abs(v.Length() - 13.0) < 1.0e-12 &&
                        std::abs(out.x - 11.0) < 1.0e-12 &&
                        std::abs(out.y - 22.0) < 1.0e-12 &&
                        std::abs(out.z - 33.0) < 1.0e-12 &&
                        std::abs(m.determinant() - 1.0) < 1.0e-12;
              std::cout << "FreeCADBase host test: " << (ok ? "PASS" : "FAIL") << '\n';
              return ok ? 0 : 1;
          }
          CPP
          g++ -std=c++20 -O2 \
            -I.deps/freecad-generated \
            -I.deps/freecad/src/Base \
            -I.deps/boost \
            .deps/freecad/src/Base/Vector3D.cpp \
            .deps/freecad/src/Base/Matrix.cpp \
            /tmp/freecad-base-smoke.cpp \
            -o /tmp/freecad-base-smoke
          /tmp/freecad-base-smoke

      - uses: actions/download-artifact@v4
        with:
          name: occt-step-armeabi-v7a
          path: .deps/occt/armeabi-v7a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.OCCT_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: occt-step-arm64-v8a
          path: .deps/occt/arm64-v8a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.OCCT_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: cpython-armeabi-v7a
          path: .deps/python/armeabi-v7a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.CPYTHON_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: cpython-arm64-v8a
          path: .deps/python/arm64-v8a
          repository: MedinaParra/FreeCAD-Native
          run-id: ${{ env.CPYTHON_SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable upstream FreeCADBase runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('app/src/main/cpp/CMakeLists.txt')
          text = cmake.read_text()
          text = text.replace(
              'CadCore.cpp CadCoreScripting.cpp OcctMesher.cpp StepIo.cpp',
              'BaseRuntimeProbe.cpp CadCore.cpp CadCoreScripting.cpp OcctMesher.cpp StepIo.cpp\n'
              '    "${FREECAD_BASE_SOURCE}/Vector3D.cpp"\n'
              '    "${FREECAD_BASE_SOURCE}/Matrix.cpp"')
          text = text.replace('cxx_std_17', 'cxx_std_20')
          text = text.replace(
              '"${CMAKE_CURRENT_SOURCE_DIR}" "${OCCT_INCLUDE_DIR}" "${PYTHON_INCLUDE_DIR}")',
              '"${CMAKE_CURRENT_SOURCE_DIR}" "${OCCT_INCLUDE_DIR}" "${PYTHON_INCLUDE_DIR}"\n'
              '    "${FREECAD_BASE_SOURCE}" "${FREECAD_BASE_GENERATED}" "${BOOST_HEADER_ROOT}")')
          cmake.write_text(text)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text().replace('-std=c++17', '-std=c++20')
          text = text.replace(
              '"-DPYTHON_INSTALL_ROOT=${rootProject.projectDir.absolutePath}/.deps/python"',
              '"-DPYTHON_INSTALL_ROOT=${rootProject.projectDir.absolutePath}/.deps/python",\n'
              '                    "-DFREECAD_BASE_SOURCE=${rootProject.projectDir.absolutePath}/.deps/freecad/src/Base",\n'
              '                    "-DFREECAD_BASE_GENERATED=${rootProject.projectDir.absolutePath}/.deps/freecad-generated",\n'
              '                    "-DBOOST_HEADER_ROOT=${rootProject.projectDir.absolutePath}/.deps/boost"')
          text = text.replace('versionCode = 7', 'versionCode = 10')
          text = text.replace('versionName = "0.6.0-step-io"',
                              'versionName = "0.9.0-freecad-base"')
          gradle.write_text(text)

          bridge = Path('app/src/main/java/com/medinaparra/freecadandroid/nativebridge/FreeCadBaseBridge.kt')
          bridge.write_text('''package com.medinaparra.freecadandroid.nativebridge

          object FreeCadBaseBridge {
              init { System.loadLibrary("freecad_android_core") }
              external fun nativeSelfTest(): String
              fun selfTest(): String = try { nativeSelfTest() }
                  catch (error: Throwable) {
                      "FREECAD BASE NO DISPONIBLE\\n${error.message ?: error::class.java.simpleName}"
                  }
          }
          '''.replace('          ', ''))

          screen = Path('app/src/main/java/com/medinaparra/freecadandroid/ui/MainScreenFiles.kt')
          text = screen.read_text()
          text = text.replace(
              'import com.medinaparra.freecadandroid.nativebridge.NativeCadBridge',
              'import com.medinaparra.freecadandroid.nativebridge.FreeCadBaseBridge\n'
              'import com.medinaparra.freecadandroid.nativebridge.NativeCadBridge')
          text = text.replace(
              'var state by remember { mutableStateOf(FilesState()) }',
              'var state by remember { mutableStateOf(FilesState()) }\n'
              '    val freeCadBaseStatus = remember { FreeCadBaseBridge.selfTest() }')
          text = text.replace(
              'CPYTHON + OCCT + STEP + FCMACRO + FCSTD',
              'FREECADBASE + CPYTHON + OCCT + STEP + FCMACRO + FCSTD')
          text = text.replace(
              'state.error ?: scene?.summary ?: state.phase,',
              'state.error ?: ((scene?.summary ?: state.phase) + "\\n\\n" + freeCadBaseStatus),')
          text = text.replace('maxLines = 10', 'maxLines = 14')
          screen.write_text(text)

          assets = Path('app/src/main/assets/licenses')
          assets.mkdir(parents=True, exist_ok=True)
          Path(assets / 'FreeCAD-LGPL-2.1.txt').write_text(
              Path('.deps/freecad/LICENSE').read_text())
          PY
          grep -q 'BaseRuntimeProbe.cpp' app/src/main/cpp/CMakeLists.txt
          grep -q 'cxx_std_20' app/src/main/cpp/CMakeLists.txt
          grep -q 'FREECADBASE + CPYTHON' \
            app/src/main/java/com/medinaparra/freecadandroid/ui/MainScreenFiles.kt

      - name: Package validated OCCT and CPython runtimes
        run: |
          rm -rf app/src/main/jniLibs app/src/main/assets/python-runtime .build/python-assets
          mkdir -p app/src/main/assets/python-runtime .build/python-assets
          for ABI in armeabi-v7a arm64-v8a; do
            test -f ".deps/occt/${ABI}/lib/libTKDESTEP.so"
            test -f ".deps/python/${ABI}/lib/libpython3.14.so"
            mkdir -p "app/src/main/jniLibs/${ABI}"
            cp ".deps/occt/${ABI}/lib/"*.so "app/src/main/jniLibs/${ABI}/"
            find ".deps/python/${ABI}/lib" -maxdepth 1 -type f -name '*.so' \
              -exec cp {} "app/src/main/jniLibs/${ABI}/" \;
            STAGE=".build/python-assets/${ABI}"
            mkdir -p "${STAGE}/lib/python3.14/site-packages"
            rsync -a ".deps/python/${ABI}/lib/python3.14/" "${STAGE}/lib/python3.14/"
            cp app/src/main/python/*.py "${STAGE}/lib/python3.14/site-packages/"
            find "${STAGE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            (cd "${STAGE}" && zip -q -9 -r \
              "${GITHUB_WORKSPACE}/app/src/main/assets/python-runtime/${ABI}.zip" .)
          done

      - name: Compile APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee freecad-base-build.log

      - name: Verify upstream FreeCADBase runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "${APK}" | tee apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "lib/${ABI}/libfreecad_android_core.so" apk-contents.txt
            grep -q "lib/${ABI}/libTKDESTEP.so" apk-contents.txt
            grep -q "lib/${ABI}/libpython3.14.so" apk-contents.txt
          done
          grep -q 'assets/licenses/FreeCAD-LGPL-2.1.txt' apk-contents.txt
          find app/build -name libfreecad_android_core.so -print -exec sh -c \
            'llvm-nm -C "$1" 2>/dev/null | grep -q "Base::Matrix4D::determinant"' _ {} \;
          cp "${APK}" FreeCAD-Android-Base-Runtime-v0.9.0.apk
          sha256sum FreeCAD-Android-Base-Runtime-v0.9.0.apk \
            > FreeCAD-Android-Base-Runtime-v0.9.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: freecad-android-base-runtime-apk
          path: |
            FreeCAD-Android-Base-Runtime-v0.9.0.apk
            FreeCAD-Android-Base-Runtime-v0.9.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-base-runtime-diagnostics
          path: |
            freecad-base-build.log
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 7
