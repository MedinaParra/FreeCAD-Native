name: OCCT core device APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  OCCT_TAG: V7_9_2
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  build-occt:
    name: OCCT ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          command -v ninja
          ninja --version

      - name: Cache compiled OCCT
        id: cache-occt
        uses: actions/cache@v4
        with:
          path: .deps/occt/${{ matrix.abi }}
          key: occt-${{ env.OCCT_TAG }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ matrix.abi }}-modeling-v2

      - name: Download OCCT source
        if: steps.cache-occt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .deps/src
          curl --fail --location --retry 4 \
            "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/${OCCT_TAG}.tar.gz" \
            --output .deps/src/occt.tar.gz
          tar -xzf .deps/src/occt.tar.gz -C .deps/src
          SOURCE_DIR="$(find .deps/src -mindepth 1 -maxdepth 1 -type d -name 'OCCT-*' | head -n 1)"
          test -n "${SOURCE_DIR}"
          mv "${SOURCE_DIR}" .deps/src/occt
          test -f .deps/src/occt/CMakeLists.txt

      - name: Configure OCCT for Android
        if: steps.cache-occt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          CMAKE_BIN="${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          NINJA_BIN="$(command -v ninja)"
          INSTALL_ROOT="${GITHUB_WORKSPACE}/.deps/occt/${{ matrix.abi }}"
          mkdir -p ".deps/build/occt-${{ matrix.abi }}" "${INSTALL_ROOT}"

          set -o pipefail
          "${CMAKE_BIN}" \
            -S .deps/src/occt \
            -B ".deps/build/occt-${{ matrix.abi }}" \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="${NINJA_BIN}" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_ROOT}" \
            -DINSTALL_DIR="${INSTALL_ROOT}" \
            -DINSTALL_DIR_LAYOUT=Unix \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_CPP_STANDARD=C++17 \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_DataExchange=OFF \
            -DBUILD_MODULE_DETools=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_RELEASE_DISABLE_EXCEPTIONS=OFF \
            -DBUILD_ENABLE_FPE_SIGNAL_HANDLER=OFF \
            -DBUILD_RESOURCES=OFF \
            -DBUILD_DOC_Overview=OFF \
            -DBUILD_SAMPLES_QT=OFF \
            -DBUILD_Inspector=OFF \
            -DINSTALL_SAMPLES=OFF \
            -DINSTALL_TEST_CASES=OFF \
            -DBUILD_YACCLEX=OFF \
            -DBUILD_USE_PCH=OFF \
            -DUSE_MMGR_TYPE=NATIVE \
            -DUSE_TK=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_TBB=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_GLES2=OFF \
            -DUSE_FREEIMAGE=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_RAPIDJSON=OFF \
            -DUSE_DRACO=OFF \
            -DUSE_VTK=OFF \
            2>&1 | tee "occt-configure-${{ matrix.abi }}.log"

      - name: Build and install OCCT
        if: steps.cache-occt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CMAKE_BIN="${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          set -o pipefail
          "${CMAKE_BIN}" --build ".deps/build/occt-${{ matrix.abi }}" \
            --target install --parallel 2 \
            2>&1 | tee "occt-build-${{ matrix.abi }}.log"

      - name: Upload OCCT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt-diagnostics-${{ matrix.abi }}
          path: |
            occt-configure-${{ matrix.abi }}.log
            occt-build-${{ matrix.abi }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify OCCT modeling toolkits
        run: |
          set -euo pipefail
          ROOT=".deps/occt/${{ matrix.abi }}"
          test -f "${ROOT}/include/opencascade/BRepPrimAPI_MakeBox.hxx"
          for LIB in TKernel TKMath TKG2d TKG3d TKGeomBase TKBRep TKGeomAlgo TKTopAlgo TKPrim TKBO TKBool TKMesh; do
            test -f "${ROOT}/lib/lib${LIB}.so"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: occt-${{ matrix.abi }}
          path: .deps/occt/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7

  build-apk:
    name: Android OCCT APK
    needs: build-occt
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: occt-armeabi-v7a
          path: .deps/occt/armeabi-v7a
      - uses: actions/download-artifact@v4
        with:
          name: occt-arm64-v8a
          path: .deps/occt/arm64-v8a

      - name: Package OCCT shared libraries
        run: |
          set -euo pipefail
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p "app/src/main/jniLibs/${ABI}"
            cp ".deps/occt/${ABI}/lib/"*.so "app/src/main/jniLibs/${ABI}/"
          done

      - name: Compile OCCT-backed APK
        run: |
          set -euo pipefail
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace \
            2>&1 | tee occt-app-build.log

      - name: Verify packaged CAD kernel
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          for ABI in armeabi-v7a arm64-v8a; do
            for LIB in freecad_android_core TKernel TKBRep TKPrim TKBO TKMesh; do
              grep -q "lib/${ABI}/lib${LIB}.so" apk-contents.txt
            done
          done
          cp app/build/outputs/apk/debug/app-debug.apk FreeCAD-Android-OCCT-Core-v0.4.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: freecad-android-occt-core-apk
          path: FreeCAD-Android-OCCT-Core-v0.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt-apk-diagnostics
          path: |
            occt-app-build.log
            apk-contents.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Report build failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = ['occt-app-build.log', 'apk-contents.txt'];
            const content = files
              .filter(file => fs.existsSync(file))
              .map(file => `### ${file}\n\n\`\`\`text\n${fs.readFileSync(file, 'utf8').slice(-16000)}\n\`\`\``)
              .join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## OCCT core build failure\n\n${content || 'The build failed before a diagnostic log was created.'}`
            });
